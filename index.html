<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Grooves — Ecosistemas Creativos</title>
  <meta name="description" content="Grooves — Ecosistemas Creativos. Whitepaper v2.0">
  <meta name="theme-color" content="#111113">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-128.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C8A96E;--gold-light:#d9bf8a;--gold-dim:#8a7548;--bg:#111113;--bg-sidebar:#0c0c0e;--bg-content:#16161a;--bg-card:#1e1e24;--border:#2a2a30;--text:#d4d4d8;--text-bright:#fafafa;--text-dim:#71717a;--sidebar-w:280px;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    html{font-size:16px}
    body{font-family:var(--font)!important;background:var(--bg)!important;color:var(--text)!important;line-height:1.7;overflow-x:hidden}

    /* Sidebar */
    .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--bg-sidebar)!important;border-right:1px solid var(--border);overflow-y:auto;z-index:100;transition:transform .3s ease}
    .sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid var(--border);text-align:center}
    .sidebar-brand a{display:block;text-decoration:none!important;border:none!important}
    .sidebar-brand img{width:200px;height:auto;display:block;margin:0 auto}
    .sidebar-brand span{display:block;color:var(--text-dim);font-size:10px;letter-spacing:2px;margin-top:6px;font-weight:400;text-transform:uppercase}
    .sidebar-nav{padding:16px 0}
    .sidebar-nav ul{list-style:none!important;padding:0!important;margin:0!important}
    .sidebar-nav li a,.sidebar-nav ul li a{display:block;padding:10px 24px;color:var(--text-dim)!important;text-decoration:none!important;border:none!important;border-bottom:none!important;font-size:14px;font-weight:500;transition:all .2s;border-left:3px solid transparent!important}
    .sidebar-nav li a:hover,.sidebar-nav ul li a:hover{color:var(--text)!important;background:rgba(200,169,110,.05);border-left-color:var(--gold-dim)!important}
    .sidebar-nav li.active>a,.sidebar-nav ul li.active>a{color:var(--gold)!important;background:rgba(200,169,110,.08);border-left-color:var(--gold)!important}
    .sidebar-nav li ul{padding-left:12px!important}
    .sidebar-nav li ul li a{font-size:13px!important;padding:6px 24px!important}

    /* Hamburger */
    .menu-toggle{display:none;position:fixed;top:14px;left:14px;z-index:200;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--gold);line-height:0}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90}

    /* Main */
    .main{margin-left:var(--sidebar-w);min-height:100vh;background:var(--bg-content)!important}
    #main{background:var(--bg-content)!important}
    .content,section.content{max-width:780px!important;margin:0 auto;padding:48px 40px 80px;background:var(--bg-content)!important}
    .markdown-section{max-width:780px!important;background:var(--bg-content)!important;color:var(--text)!important;font-family:var(--font)!important}

    /* Headings */
    .content h1,.markdown-section h1{color:var(--gold)!important;font-size:28px!important;font-weight:700!important;margin-bottom:8px!important;padding-bottom:14px!important;border-bottom:2px solid var(--gold-dim)!important;letter-spacing:.5px}
    .content h2,.markdown-section h2{color:var(--gold-light)!important;font-size:20px!important;font-weight:600!important;margin-top:40px!important;margin-bottom:16px!important;padding-bottom:8px!important;border-bottom:1px solid var(--border)!important}
    .content h3,.markdown-section h3{color:var(--text-bright)!important;font-size:16px!important;font-weight:600!important;margin-top:28px!important;margin-bottom:12px!important}

    /* Paragraphs */
    .content p,.markdown-section p{margin-bottom:16px!important;color:var(--text)!important;text-align:justify!important;line-height:1.7!important}
    .content strong,.markdown-section strong{color:var(--text-bright)!important}
    .content em,.markdown-section em{color:var(--text)!important}
    .content a,.markdown-section a{color:var(--gold)!important;text-decoration:none!important}
    .content a:hover,.markdown-section a:hover{color:var(--gold-light)!important}

    /* Lists */
    .content ul,.content ol,.markdown-section ul,.markdown-section ol{margin:12px 0 20px 20px!important}
    .content li,.markdown-section li{margin:8px 0!important;color:var(--text)!important;text-align:justify!important;line-height:1.7!important}
    .content li strong,.markdown-section li strong{color:var(--text-bright)!important}

    /* Tables */
    .content table,.markdown-section table{width:100%!important;border-collapse:collapse!important;margin:20px 0!important;font-size:14px!important;display:table!important}
    .content thead th,.markdown-section thead th,.markdown-section table thead th{background:var(--bg-card)!important;color:var(--gold)!important;font-weight:600!important;padding:12px 16px!important;text-align:left!important;border:1px solid var(--border)!important;font-size:12px!important;text-transform:uppercase;letter-spacing:.5px}
    .content tbody td,.markdown-section tbody td,.markdown-section table tbody td{padding:10px 16px!important;border:1px solid var(--border)!important;color:var(--text)!important}
    .content tbody tr:nth-child(odd),.markdown-section tbody tr:nth-child(odd){background:#16161a!important}
    .content tbody tr:nth-child(even),.markdown-section tbody tr:nth-child(even){background:#1a1a20!important}
    .content tbody tr:hover,.markdown-section tbody tr:hover{background:var(--bg-card)!important}

    /* Blockquotes */
    .content blockquote,.markdown-section blockquote{border-left:4px solid var(--gold)!important;background:var(--bg-card)!important;padding:16px 20px!important;margin:20px 0!important;border-radius:0 8px 8px 0!important;color:var(--text)!important}
    .content blockquote p,.markdown-section blockquote p{color:var(--text)!important;margin-bottom:0!important;text-align:justify!important}

    /* Alerts */
    .alert{border-radius:8px!important;padding:18px 22px!important;margin:24px 0!important;border-left:4px solid!important;border-top:none!important;border-right:none!important;border-bottom:none!important}
    .alert.callout.note{background:#1a1d2e!important;border-left-color:#4a6fa5!important}
    .alert.callout.tip{background:#1a2e1a!important;border-left-color:#4a8c5c!important}
    .alert.callout.warning{background:#2e2a1a!important;border-left-color:var(--gold)!important}
    .alert.callout.attention{background:#2e1a1a!important;border-left-color:#c0392b!important}
    .alert .title{display:none!important;height:0!important;margin:0!important;padding:0!important}
    .alert p{color:var(--text)!important;text-align:justify!important}
    p.tip,.markdown-section p.tip{background:#1a2e1a!important;border-left:4px solid #4a8c5c!important;padding:16px 20px!important;border-radius:0 8px 8px 0!important;color:var(--text)!important;text-align:justify!important}
    p.warn,.markdown-section p.warn{background:#2e2a1a!important;border-left:4px solid var(--gold)!important;padding:16px 20px!important;border-radius:0 8px 8px 0!important;color:var(--text)!important;text-align:justify!important}

    /* HR */
    .content hr,.markdown-section hr{border:none!important;border-top:1px solid var(--border)!important;margin:32px 0!important}

    /* Code */
    .content code,.markdown-section code{background:var(--bg-card)!important;color:var(--gold)!important;padding:2px 7px!important;border-radius:4px!important;font-size:13px!important}
    .content pre,.markdown-section pre{background:var(--bg-card)!important;border:1px solid var(--border)!important;border-radius:8px!important;padding:16px!important;overflow-x:auto}
    .content pre code,.markdown-section pre code{background:transparent!important;padding:0!important}

    /* Images in content (logo on homepage) */
    .content img,.markdown-section img{max-width:100%!important;height:auto!important}
    .logo-home{display:block;margin:0 auto 24px;max-width:380px!important}

    /* Pagination */
    .docsify-pagination-container{display:flex!important;justify-content:space-between!important;margin-top:48px!important;padding-top:24px!important;border-top:1px solid var(--border)!important;gap:16px!important}
    .pagination-item{flex:1!important;max-width:50%!important}
    .pagination-item a{display:block!important;padding:16px 20px!important;background:var(--bg-card)!important;border:1px solid var(--border)!important;border-radius:8px!important;text-decoration:none!important;transition:border-color .2s}
    .pagination-item a:hover{border-color:var(--gold-dim)!important}
    .pagination-item-label{font-size:11px!important;color:var(--text-dim)!important;text-transform:uppercase!important;letter-spacing:1px!important;margin-bottom:4px!important;display:block!important}
    .pagination-item-title{font-size:14px!important;font-weight:600!important;color:var(--gold)!important;display:block!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
    .pagination-item-subtitle,.pagination-item .pagination-item-subtitle{display:none!important;height:0!important;max-height:0!important;overflow:hidden!important;visibility:hidden!important;font-size:0!important;line-height:0!important;margin:0!important;padding:0!important}
    .pagination-item--next{text-align:right!important}
    .pagination-item--next a{text-align:right!important}
    .pagination-item--previous a{text-align:left!important}

    /* Footer */
    .page-footer{margin-top:60px;padding:30px 0;border-top:1px solid var(--border);text-align:center}
    .page-footer img{width:140px;height:auto;opacity:.5;display:block;margin:0 auto 12px}
    .page-footer p{color:var(--text-dim)!important;font-size:12px!important;text-align:center!important;margin:0!important;letter-spacing:.5px}

    /* Search */
    .search{padding:14px 16px;border-bottom:1px solid var(--border)}
    .search input{width:100%!important;background:var(--bg-card)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:6px!important;padding:10px 14px!important;font-size:14px!important;font-family:var(--font)!important;outline:none!important}
    .search input:focus{border-color:var(--gold-dim)!important}
    .search input::placeholder{color:var(--text-dim)!important}
    .search .results-panel{background:var(--bg-sidebar)!important}
    .search .matching-post{background:var(--bg-card)!important;border-bottom:1px solid var(--border)!important;padding:10px 14px!important}
    .search .matching-post a{color:var(--gold)!important}
    .search .matching-post p{color:var(--text-dim)!important;font-size:13px!important}

    /* Mermaid */
    .mermaid{background:transparent!important;margin:24px 0!important;text-align:center!important;overflow-x:auto!important}
    .mermaid svg{max-width:100%!important;height:auto!important}
    .mermaid .node rect,.mermaid .node polygon{rx:8;ry:8}
    .mermaid .edgeLabel{background:#1e1e24!important;color:#d4d4d8!important;padding:2px 6px;border-radius:4px;font-size:12px}
    .mermaid .label{color:#d4d4d8!important;font-family:var(--font)!important;font-size:16px!important}
    .mermaid .edgePath .path{stroke:#555!important;stroke-width:1.5px}
    .mermaid .cluster rect{fill:#1e1e24!important;stroke:#444!important;rx:8;ry:8}
    .mermaid .cluster text{fill:#d4d4d8!important}

    /* Scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}
    .sidebar::-webkit-scrollbar{width:3px}

    /* Mobile */
    @media(max-width:860px){
      .sidebar{transform:translateX(-100%)}
      .sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.5)}
      .menu-toggle{display:block}
      .overlay.open{display:block}
      .main{margin-left:0!important}
      .content,section.content{padding:60px 18px 80px!important}
      .content h1,.markdown-section h1{font-size:22px!important}
      .content h2,.markdown-section h2{font-size:17px!important;margin-top:30px!important}
      .content h3,.markdown-section h3{font-size:15px!important}
      .content p,.markdown-section p,.content li,.markdown-section li{font-size:15px!important}
      .content table,.markdown-section table{display:block!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;font-size:13px!important}
      .content thead th,.markdown-section thead th,.content tbody td,.markdown-section tbody td{padding:8px 12px!important;white-space:nowrap!important}
      .docsify-pagination-container{flex-direction:column!important}
      .pagination-item{max-width:100%!important}
      .alert{padding:14px 16px!important}
      .content blockquote,.markdown-section blockquote{padding:12px 16px!important;margin:16px 0!important}
      .mermaid{overflow-x:auto!important;-webkit-overflow-scrolling:touch;padding:8px 0}
      .mermaid svg{min-width:auto!important;max-width:none!important}
      .logo-home{max-width:260px!important}
      .sidebar-brand img{width:160px}
    }

    /* Hide defaults */
    body>nav,.github-corner,.docsify-darklight-theme-toggle,.app-nav{display:none!important}
  </style>
</head>
<body>
  <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="5" x2="17" y2="5"/>
      <line x1="3" y1="10" x2="17" y2="10"/>
      <line x1="3" y1="15" x2="17" y2="15"/>
    </svg>
  </button>
  <div class="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <a href="#/">
        <img src="assets/logo-small.png" alt="Grooves">
      </a>
      <span>Ecosistemas Creativos</span>
    </div>
    <div class="search" id="search-container"></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>
  <main class="main">
    <div class="content" id="main"></div>
  </main>
  <script>
    function toggleSidebar(){
      document.getElementById('sidebar').classList.toggle('open');
      document.querySelector('.overlay').classList.toggle('open');
    }
    document.addEventListener('click',function(e){
      if(e.target.closest('.sidebar-nav a')&&window.innerWidth<=860){
        document.getElementById('sidebar').classList.remove('open');
        document.querySelector('.overlay').classList.remove('open');
      }
    });
  </script>
  <script>
    window.$docsify={
      el:'#main',
      name:'GROOVES',
      repo:false,
      loadSidebar:true,
      subMaxLevel:2,
      auto2top:true,
      noEmoji:true,
      routerMode:'hash',
      search:{placeholder:'Buscar...',noData:'Sin resultados',depth:3},
      'flexible-alerts':{note:{label:''},tip:{label:''},warning:{label:''},attention:{label:''}},
      pagination:{previousText:'ANTERIOR',nextText:'SIGUIENTE',crossChapter:true,crossChapterText:true},
      plugins:[
        function(hook){
          var footer='<div class="page-footer"><img src="assets/logo-small.png" alt="Grooves"><p>Grooves © 2026 — Ecosistemas Creativos</p><p>www.grooves.art</p></div>';
          hook.afterEach(function(html){
            return html+footer;
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1/dist/docsify-plugin-flexible-alerts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({startOnLoad:false,theme:'dark',themeVariables:{darkMode:true,background:'#16161a',primaryColor:'#C8A96E',primaryTextColor:'#111',primaryBorderColor:'#8a7548',lineColor:'#555',secondaryColor:'#1a2e1a',tertiaryColor:'#1a1d2e',fontFamily:'Inter,sans-serif',fontSize:'16px'}});
    window.$docsify.markdown={renderer:{code:function(code,lang){if(lang==='mermaid'){return'<div class="mermaid">'+code+'</div>'}return this.origin.code.apply(this,arguments)}}};
    window.$docsify.plugins.push(function(hook){hook.doneEach(function(){mermaid.run({querySelector:'.mermaid'})})});
  </script>
</body>
</html>
