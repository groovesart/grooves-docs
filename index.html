<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Grooves — Ecosistemas Creativos</title>
  <meta name="description" content="Grooves — Ecosistemas Creativos. Whitepaper v2.0">
  <meta name="theme-color" content="#111113">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-128.png">
  <!-- Docsify base theme (provides sidebar layout structure) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Override theme colors ── */
    :root{
      --base-font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --base-font-size:16px;
      --base-line-height:1.7;
      --base-color:#d4d4d8;
      --base-background-color:#16161a;
      --sidebar-background:#0c0c0e;
      --sidebar-border-color:#2a2a30;
      --sidebar-border-width:1px;
      --sidebar-width:280px;
      --sidebar-nav-link-color:#71717a;
      --sidebar-nav-link-color--active:#C8A96E;
      --sidebar-nav-link-border-color--active:#C8A96E;
      --sidebar-nav-link-background-color--active:rgba(200,169,110,.08);
      --sidebar-name-color:#C8A96E;
      --sidebar-name-font-size:20px;
      --heading-color:#C8A96E;
      --heading-h1-color:#C8A96E;
      --heading-h2-color:#d9bf8a;
      --heading-h1-border-color:#8a7548;
      --heading-h2-border-color:#2a2a30;
      --heading-h1-font-size:28px;
      --heading-h2-font-size:20px;
      --heading-h3-font-size:16px;
      --link-color:#C8A96E;
      --link-text-decoration:none;
      --blockquote-border-color:#C8A96E;
      --blockquote-background:#1e1e24;
      --code-inline-background:#1e1e24;
      --code-inline-color:#C8A96E;
      --table-head-background:#1e1e24;
      --table-head-color:#C8A96E;
      --table-body-border-color:#2a2a30;
      --table-row-even-background:#1a1a20;
      --table-row-odd-background:#16161a;
      --search-input-background-color:#1e1e24;
      --search-input-border-color:#2a2a30;
      --search-input-color:#d4d4d8;
      --pagination-title-color:#C8A96E;
      --pagination-label-color:#71717a;
      --notice-tip-background:#1a2e1a;
      --notice-tip-border-color:#4a8c5c;
      --notice-important-background:#1a1d2e;
      --notice-important-border-color:#4a6fa5;
    }

    body{background:var(--base-background-color)!important;overflow-x:hidden}
    .sidebar{background:var(--sidebar-background)!important}

    /* ── Sidebar logo ── */
    .app-name-link{text-decoration:none!important;display:block;text-align:center;padding:16px 12px 12px}
    .app-name-link img{width:180px;height:auto;display:block;margin:0 auto}
    .sidebar-subtitle{display:block;color:#71717a;font-size:10px;letter-spacing:2px;text-align:center;text-transform:uppercase;margin-top:6px;padding-bottom:12px;border-bottom:1px solid #2a2a30}

    /* ── Sidebar nav refinement ── */
    .sidebar-nav a{font-size:14px!important;font-weight:500!important;transition:all .2s!important}
    .sidebar-nav a:hover{color:#d4d4d8!important}
    .sidebar-nav .active>a{font-weight:600!important}

    /* ── Typography ── */
    .markdown-section{max-width:780px!important;font-family:'Inter',-apple-system,sans-serif!important}
    .markdown-section p{text-align:justify!important;line-height:1.7!important}
    .markdown-section li{text-align:justify!important;line-height:1.7!important}
    .markdown-section strong{color:#fafafa!important}
    .markdown-section blockquote p{text-align:justify!important;margin-bottom:0!important}
    .markdown-section h3{color:#fafafa!important}

    /* ── Tables ── */
    .markdown-section table{width:100%!important;font-size:14px!important}
    .markdown-section thead th{font-size:12px!important;text-transform:uppercase!important;letter-spacing:.5px!important;font-weight:600!important;padding:12px 16px!important}
    .markdown-section tbody td{padding:10px 16px!important}
    .markdown-section tbody tr:hover{background:#1e1e24!important}

    /* ── Alerts — hide labels ── */
    .alert .title{display:none!important}
    .alert p{text-align:justify!important}

    /* ── Images ── */
    .markdown-section img{max-width:100%!important;height:auto!important}
    .logo-home{display:block!important;margin:0 auto 8px!important;max-width:380px!important}

    /* ── Pagination subtitle hide ── */
    .pagination-item-subtitle{display:none!important;height:0!important;visibility:hidden!important;font-size:0!important;margin:0!important;padding:0!important}
    .pagination-item-title{font-weight:600!important}

    /* ── Footer ── */
    .page-footer{margin-top:60px;padding:30px 0;border-top:1px solid #2a2a30;text-align:center}
    .page-footer img{width:140px;height:auto;opacity:.5;display:block;margin:0 auto 12px}
    .page-footer p{color:#71717a!important;font-size:12px!important;text-align:center!important;margin:4px 0 0!important;letter-spacing:.5px}

    /* ── Mermaid ── */
    .mermaid{background:transparent!important;margin:24px 0!important;text-align:center!important;overflow-x:auto!important}
    .mermaid svg{max-width:100%!important;height:auto!important}
    .mermaid .label{font-family:'Inter',sans-serif!important;font-size:16px!important}
    .mermaid .edgeLabel{background:#1e1e24!important}
    .mermaid .edgePath .path{stroke:#555!important}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:#8a7548}
    .sidebar::-webkit-scrollbar{width:3px}

    /* ── Mobile ── */
    @media(max-width:768px){
      .markdown-section h1{font-size:22px!important}
      .markdown-section h2{font-size:17px!important;margin-top:30px!important}
      .markdown-section p,.markdown-section li{font-size:15px!important}
      .markdown-section table{display:block!important;overflow-x:auto!important;font-size:13px!important}
      .markdown-section thead th,.markdown-section tbody td{padding:8px 12px!important;white-space:nowrap!important}
      .docsify-pagination-container{flex-direction:column!important}
      .pagination-item{max-width:100%!important}
      .logo-home{max-width:260px!important}
      .app-name-link img{width:140px}
      .mermaid{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
    }

    /* ── Hide github corner ── */
    .github-corner{display:none!important}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify={
      name:'<img src="assets/logo-small.png" alt="Grooves"><span class="sidebar-subtitle">Ecosistemas Creativos</span>',
      nameLink:'/',
      repo:false,
      loadSidebar:true,
      subMaxLevel:2,
      auto2top:true,
      noEmoji:true,
      routerMode:'hash',
      search:{placeholder:'Buscar...',noData:'Sin resultados',depth:3},
      'flexible-alerts':{note:{label:''},tip:{label:''},warning:{label:''},attention:{label:''}},
      pagination:{previousText:'ANTERIOR',nextText:'SIGUIENTE',crossChapter:true,crossChapterText:true},
      plugins:[
        function(hook){
          var footer='<div class="page-footer"><img src="assets/logo-small.png" alt="Grooves"><p>Grooves &copy; 2026 — Ecosistemas Creativos</p><p>www.grooves.art</p></div>';
          hook.afterEach(function(html){return html+footer;});
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1/dist/docsify-plugin-flexible-alerts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({startOnLoad:false,theme:'dark',themeVariables:{darkMode:true,background:'#16161a',primaryColor:'#C8A96E',primaryTextColor:'#111',primaryBorderColor:'#8a7548',lineColor:'#555',secondaryColor:'#1a2e1a',tertiaryColor:'#1a1d2e',fontFamily:'Inter,sans-serif',fontSize:'14px'}});
    window.$docsify.markdown={renderer:{code:function(code,lang){if(lang==='mermaid'){return'<div class="mermaid">'+code+'</div>'}return this.origin.code.apply(this,arguments)}}};
    window.$docsify.plugins.push(function(hook){hook.doneEach(function(){mermaid.run({querySelector:'.mermaid'})})});
  </script>
</body>
</html>
